# Delivery: the API and web images, pushed to GHCR after CI is green on main.
# Docker Desktop then runs them with: docker compose --profile app pull && docker compose --profile app up -d
# On a PR the images are only built (no push), so a broken Dockerfile shows up before merge.
name: CD

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    # workflow_run fires on every CI result: publish only the commits whose CI passed on a push to main.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: src/Pos.Api/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    env:
      # The commit CI tested; on a PR, the PR head.
      SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      PUBLISH: ${{ github.event_name == 'workflow_run' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minipos-${{ matrix.name }}"
          tags="$image:sha-${SHA::7}"
          # latest only for the current head of main: a late or rerun CI of an older commit must not move it back.
          if [ "$PUBLISH" != "true" ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            tags="$tags,$image:latest"
          else
            echo "::notice::$SHA is no longer the head of main; pushing only sha-${SHA::7}."
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
