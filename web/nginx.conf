# The API host lives here, not in the Angular code: the app calls relative /api URLs, as with the dev proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve "api" through Docker's DNS at request time (a variable in proxy_pass), so a recreated api container
    # with a new IP is found without restarting web.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        # $http_host keeps the port, so the API's Location headers point back at this server (localhost:8080).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (e.g. /orders/42) are client-side: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
