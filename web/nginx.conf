# The API host lives here, not in the Angular code: the app calls relative /api URLs, as with the dev proxy.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (e.g. /orders/42) are client-side: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
